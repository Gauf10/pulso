<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/pulso-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0a1a12" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <title>Pulso</title>
    <style>
      #splash {
        position: fixed; inset: 0; z-index: 9999;
        background: #0a1a12;
        display: flex; align-items: center; justify-content: center;
        flex-direction: column; gap: 20px;
        transition: opacity 0.4s ease;
      }
      #splash.fade { opacity: 0; pointer-events: none; }
      #splash img { width: 120px; height: 120px; border-radius: 24px; box-shadow: 0 4px 24px rgba(0,0,0,0.4); }
      #splash h1 { font-family: 'Inter', sans-serif; font-size: 28px; color: #e8e8f0; font-weight: 700; letter-spacing: -0.5px; margin: 0; }
      #splash p { font-family: 'Inter', sans-serif; font-size: 13px; color: #6c6c8a; margin: 0; }
    </style>
  </head>
  <body>
    <div id="splash">
      <img src="/pulso-512.png" alt="Pulso" />
      <h1>Pulso</h1>
      <p>Tu agenda, llevada a la realidad</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
